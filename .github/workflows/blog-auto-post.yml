name: Blog Auto Post

on:
  schedule:
    # 매 3시간마다 실행 (UTC 기준 00, 03, 06, 09, 12, 15, 18, 21시 = 하루 8회)
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: blog-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Network diagnostics (api.anthropic.com)
        run: |
          echo "--- DNS 조회 ---"
          getent hosts api.anthropic.com || echo "DNS 조회 실패"
          echo "--- curl 연결 테스트 ---"
          curl -sS -m 15 -o /dev/null -w "HTTP status: %{http_code}, 연결 시간: %{time_connect}s, TLS 핸드셰이크: %{time_appconnect}s\n" \
            https://api.anthropic.com/v1/models \
            -H "x-api-key: dummy-key-for-connectivity-check" \
            -H "anthropic-version: 2023-06-01" \
            || echo "curl 실패 (exit code $?)"

      - name: Generate and post blog article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python blog_poster.py --status draft

      - name: Commit topic history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used_topics.json
          git diff --cached --quiet || git commit -m "chore: 자동 포스팅 주제 기록 갱신"
          git push
