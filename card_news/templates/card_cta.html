<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles/card.css">
</head>
<body>
<div class="card theme-cta dark-theme">
  <div class="deco-circle deco-circle-1"></div>
  <div class="deco-circle deco-circle-2"></div>
  <div class="card-number">{{number}} / {{total}}</div>
  <div class="brand">{{brand}}</div>
  <div class="content">
    <div class="cta-emoji">{{emoji}}</div>
    <div class="cta-title">{{title}}</div>
    <div class="divider"></div>
    <div class="cta-buttons">
      <div class="cta-btn cta-btn-primary">{{btn1}}</div>
      <div class="cta-btn cta-btn-secondary">{{btn2}}</div>
    </div>
  </div>
</div>
</body>
</html>
