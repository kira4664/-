<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles/card.css">
</head>
<body>
<div class="card theme-hook dark-theme">
  <div class="deco-circle deco-circle-1"></div>
  <div class="deco-circle deco-circle-2"></div>
  <div class="card-number">01 / {{total}}</div>
  <div class="brand">{{brand}}</div>
  <div class="content">
    <div class="hook-emoji">{{emoji}}</div>
    <div class="hook-title">{{title}}</div>
    <div class="divider"></div>
    <div class="hook-sub">{{subtitle}}</div>
  </div>
</div>
</body>
</html>
